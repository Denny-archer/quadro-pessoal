<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Definir senha · COFFITO</title><link rel="stylesheet" href="/styles/base.css"><link rel="stylesheet" href="/styles/components.css"><link rel="stylesheet" href="/styles/integracao.css"></head><body><main class="integracao"><h1>Defina sua senha</h1><p>Troque a senha provisória antes de acessar seus dados.</p><form id="primeiro" class="painel-integracao"><label>Senha provisória<input name="atual" type="password" autocomplete="current-password" required></label><label>Nova senha<input name="nova" type="password" autocomplete="new-password" minlength="10" required></label><label>Confirme a nova senha<input name="confirmacao" type="password" autocomplete="new-password" minlength="10" required></label><p>Use pelo menos 10 caracteres e no máximo 72 bytes UTF-8.</p><button class="btn primary">Salvar nova senha</button><p id="erro" role="alert"></p></form><a href="/login">Voltar ao login</a></main><script type="module" src="/scripts/shared/primeiro-acesso.js"></script></body></html>

name: quadro-pessoal

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quadro}
      POSTGRES_USER: ${POSTGRES_USER:-quadro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      TZ: America/Sao_Paulo
    volumes:
      - dados_pg:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # sem "ports": o banco não fica exposto fora da rede do Docker

  app:
    build: .
    image: coffito/quadro-pessoal:1.3.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-quadro}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-quadro}
      DB_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-quadro}
      POSTGRES_USER: ${POSTGRES_USER:-quadro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      COOKIE_SEGURO: ${COOKIE_SEGURO:-true}
      SESSAO_HORAS: ${SESSAO_HORAS:-10}
      TAMANHO_MAX_UPLOAD_MB: ${TAMANHO_MAX_UPLOAD_MB:-10}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      API_DOCS: ${API_DOCS:-false}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      TZ: America/Sao_Paulo
    ports:
      - "${PORTA:-127.0.0.1:8000}:8000"   # publique via proxy reverso com HTTPS
    volumes:
      - ./seed:/srv/seed:ro               # carga inicial opcional (python -m app.cli carregar-json /srv/seed)

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-quadro}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-quadro}
      RETENCAO_DIAS: ${BACKUP_RETENCAO_DIAS:-30}
      TZ: America/Sao_Paulo
    volumes:
      - ./backups:/backups
      - ./ops/backup.sh:/usr/local/bin/backup.sh:ro
    # um dump compactado por dia, às 02h, apagando os mais antigos que RETENCAO_DIAS
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]

volumes:
  dados_pg:

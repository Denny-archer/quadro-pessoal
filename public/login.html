<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · Quadro de Pessoal COFFITO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;600;700&display=swap">
<style>
:root{--ground:#eff5f1;--surface:#fff;--ink:#122718;--muted:#557062;--line:#d6e4da;--accent:#27774a;--accent-ink:#fff;--bad:#b3372f;
  --brand-dark:#122718;--brand:#48ad75;--brand-light:#8fcd9e;--logo-l:block;--logo-d:none}
@media (prefers-color-scheme:dark){:root{--ground:#0b1510;--surface:#12201a;--ink:#e3efe6;--muted:#93ab9c;--line:#1f3328;--accent:#6cc793;--accent-ink:#06170d;--bad:#ef7b72;--brand-dark:#e2f2e6;--logo-l:none;--logo-d:block}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ground);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,sans-serif;padding:16px}
.bar{position:fixed;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--brand-dark) 0 42%,var(--brand) 42% 74%,var(--brand-light) 74%)}
main{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px}
img{height:64px;width:auto;margin-bottom:10px}.l{display:var(--logo-l)}.d{display:var(--logo-d)}
h1{font:800 26px/1.1 Archivo,Arial,sans-serif;margin:0 0 4px;color:var(--brand-dark)}
p{margin:0 0 20px;color:var(--muted);font-size:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:14px}
input{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{width:100%;font:600 15px "Public Sans",sans-serif;border:0;border-radius:8px;padding:11px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--bad);font-size:13px;min-height:1.2em;margin:-4px 0 10px}
</style>
</head>
<body>
<div class="bar" aria-hidden="true"></div>
<main>
  <img class="l" src="/img/logo-light.webp" alt="COFFITO"><img class="d" src="/img/logo-dark.webp" alt="COFFITO">
  <h1>Quadro de Pessoal</h1>
  <p>Gestão de Pessoas · acesso restrito</p>
  <form id="f" novalidate>
    <label>E-mail<input id="email" type="email" autocomplete="username" required autofocus></label>
    <label>Senha<input id="senha" type="password" autocomplete="current-password" required></label>
    <div class="err" id="err" role="alert"></div>
    <button id="b" type="submit">Entrar</button>
  </form>
</main>
<script>
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const b = document.getElementById("b"), err = document.getElementById("err");
  b.disabled = true; err.textContent = "";
  try {
    const r = await fetch("/api/auth/login", {method: "POST", credentials: "same-origin",
      headers: {"Content-Type": "application/json", "X-Requested-With": "quadro-pessoal"},
      body: JSON.stringify({email: document.getElementById("email").value, senha: document.getElementById("senha").value})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || "Não foi possível entrar.");
    const volta = new URLSearchParams(location.search).get("volta");
    location.href = volta && volta.startsWith("/") && !volta.startsWith("//") ? volta : "/";
  } catch(x){ err.textContent = x.message; b.disabled = false; }
});
</script>
</body>
</html>
